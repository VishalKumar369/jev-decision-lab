<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .t  { font-size: 17px; font-weight: 600; fill: #f4f6fa; }
      .s  { font-size: 13px; fill: #98a2b3; }
      .o  { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
      .n  { font-size: 14px; font-weight: 700; fill: #0b0e14; }
      .ar { stroke: #667085; stroke-width: 1.6; fill: none; }
      .lg { font-size: 12px; fill: #98a2b3; }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#667085"/></marker>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#080b12"/>

  <!-- Input -->
  <g transform="translate(36,78)">
    <rect width="196" height="112" rx="10" fill="#0d111a" stroke="#2a3140" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="15" fill="#98a2b3"/><text x="30" y="35" text-anchor="middle" class="n">1</text>
    <text x="56" y="35" class="t">Input</text>
    <text x="16" y="72" class="s">Ticket · tool call · prompt</text>
    <text x="16" y="94" class="o" fill="#98a2b3">STATE</text>
  </g>
  <path class="ar" d="M236 134 H266" marker-end="url(#m)"/>

  <!-- Decision (model) -->
  <g transform="translate(272,78)">
    <rect width="196" height="112" rx="10" fill="#120f24" stroke="#7c5cff" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="15" fill="#7c5cff"/><text x="30" y="35" text-anchor="middle" class="n">2</text>
    <text x="56" y="35" class="t">Decision</text>
    <text x="16" y="72" class="s">Typed questions → P(answer)</text>
    <text x="16" y="94" class="o" fill="#7c5cff">MODEL JUDGMENT</text>
  </g>
  <path class="ar" d="M472 134 H502" marker-end="url(#m)"/>

  <!-- Confidence (code) -->
  <g transform="translate(508,78)">
    <rect width="196" height="112" rx="10" fill="#0b1720" stroke="#28c7fa" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="15" fill="#28c7fa"/><text x="30" y="35" text-anchor="middle" class="n">3</text>
    <text x="56" y="35" class="t">Confidence gate</text>
    <text x="16" y="72" class="s">≥ 0.85 auto · ≥ 0.60 escalate</text>
    <text x="16" y="94" class="o" fill="#28c7fa">CODE</text>
  </g>
  <path class="ar" d="M708 134 H738" marker-end="url(#m)"/>

  <!-- Policy (code) -->
  <g transform="translate(744,78)">
    <rect width="196" height="112" rx="10" fill="#1a140c" stroke="#f59e42" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="15" fill="#f59e42"/><text x="30" y="35" text-anchor="middle" class="n">4</text>
    <text x="56" y="35" class="t">Policy</text>
    <text x="16" y="72" class="s">Limits · dates · allowlists</text>
    <text x="16" y="94" class="o" fill="#f59e42">CODE</text>
  </g>
  <path class="ar" d="M944 134 H974" marker-end="url(#m)"/>

  <!-- Action -->
  <g transform="translate(980,78)">
    <rect width="184" height="112" rx="10" fill="#0b1a16" stroke="#2dd4a0" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="15" fill="#2dd4a0"/><text x="30" y="35" text-anchor="middle" class="n">5</text>
    <text x="56" y="35" class="t">Action</text>
    <text x="16" y="72" class="s">Auto · escalate · human</text>
    <text x="16" y="94" class="o" fill="#2dd4a0">SIMULATED</text>
  </g>

  <!-- brackets -->
  <path d="M272 214 H468" stroke="#7c5cff" stroke-width="2"/>
  <text x="370" y="238" text-anchor="middle" class="lg" fill="#7c5cff">the model makes the judgment</text>
  <path d="M508 214 H940" stroke="#28c7fa" stroke-width="2"/>
  <text x="724" y="238" text-anchor="middle" class="lg" fill="#28c7fa">code makes the policy: authorization, thresholds, arithmetic, dates, rate limits</text>

  <text x="600" y="278" text-anchor="middle" class="lg">jev-decision-lab · every request records latency, tokens, cost, the full distribution, decision, confidence, route and correctness</text>
</svg>
